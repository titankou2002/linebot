<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高雅瓷 · 產品文宣 DM 與多頁 PDF 電子目錄產生器</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root {
    --bg: #F5F2EB;
    --surface: #FFFFFF;
    --surface-soft: #FAF8F5;
    --surface-muted: #EFECE4;
    --ink: #1C1917;
    --ink-2: #44403C;
    --muted: #78716C;
    --line: #E5E0D5;
    --line-strong: #D0C9B8;
    --accent: #8C5A32;
    --accent-hover: #724725;
    --accent-soft: #F7EFE8;
    --green: #1F5E3B;
    --red: #9E2A2B;
    --radius-card: 10px;
    --radius-ctrl: 8px;
    --shadow-sm: 0 2px 6px rgba(28, 25, 23, 0.05);
    --shadow-md: 0 10px 28px rgba(28, 25, 23, 0.09);

    /* DM 畫布專屬主題變數（隨「DM風格預覽」動態切換） */
    --dm-bg: #FAF8F5;
    --dm-header-bg: #1C1917;
    --dm-header-text: #FFFFFF;
    --dm-header-sub: #D6D3CD;
    --dm-eyebrow: #D6B392;
    --dm-accent: #8C5A32;
    --dm-card-bg: #FFFFFF;
    --dm-card-border: #E5E0D5;
    --dm-stage-bg: #EFECE4;
    --dm-ink: #1C1917;
    --dm-ink-2: #44403C;
    --dm-muted: #78716C;
    --dm-stock: #1F5E3B;
  }

  /* 風格 2：奢石黑金風 */
  .dm-sheet[data-style="luxury"] {
    --dm-bg: #141312;
    --dm-header-bg: #0B0A09;
    --dm-header-text: #F7F3EB;
    --dm-header-sub: #A8A096;
    --dm-eyebrow: #D4AF37;
    --dm-accent: #C59B27;
    --dm-card-bg: #1E1C1A;
    --dm-card-border: #332F2B;
    --dm-stage-bg: #272421;
    --dm-ink: #F5F2EB;
    --dm-ink-2: #C7C0B8;
    --dm-muted: #8C857B;
    --dm-stock: #5CE096;
  }

  /* 風格 3：北歐極簡畫廊風 */
  .dm-sheet[data-style="minimal"] {
    --dm-bg: #FFFFFF;
    --dm-header-bg: #1F4D3A;
    --dm-header-text: #FFFFFF;
    --dm-header-sub: #D5E6DF;
    --dm-eyebrow: #A8D5C2;
    --dm-accent: #1F4D3A;
    --dm-card-bg: #FFFFFF;
    --dm-card-border: #E2E8F0;
    --dm-stage-bg: #F8FAFC;
    --dm-ink: #0F172A;
    --dm-ink-2: #334155;
    --dm-muted: #64748B;
    --dm-stock: #15803D;
  }

  /* 風格 4：義式雜誌畫報風 */
  .dm-sheet[data-style="editorial"] {
    --dm-bg: #EFECE6;
    --dm-header-bg: #2C2520;
    --dm-header-text: #FAF6F0;
    --dm-header-sub: #C9BFB5;
    --dm-eyebrow: #E0A96D;
    --dm-accent: #9E582F;
    --dm-card-bg: #FAF8F5;
    --dm-card-border: #DCD6CA;
    --dm-stage-bg: #E5E0D5;
    --dm-ink: #241E1A;
    --dm-ink-2: #4A4039;
    --dm-muted: #7A7067;
    --dm-stock: #1F5E3B;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px;
  }
  button, input, select { font-family: inherit; }

  /* ── 頂部導覽列 ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
  }
  .topbar-inner {
    max-width: 1420px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12.5px;
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .price-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-2);
    background: var(--surface-muted);
    padding: 5px 10px;
    border-radius: var(--radius-ctrl);
    border: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  .price-toggle input {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
  }
  .mob-filter-toggle {
    display: none;
    height: 34px;
    padding: 0 11px;
    border-radius: var(--radius-ctrl);
    border: 1px solid var(--line-strong);
    background: var(--ink);
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  @media (max-width: 960px) {
    .mob-filter-toggle { display: inline-flex; }
    .hide-on-mob { display: none !important; }
  }

  /* ── 主工作區 ── */
  .workspace {
    max-width: 1420px;
    margin: 14px auto 0;
    padding: 0 14px;
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 18px;
    align-items: start;
  }
  body.client-view .workspace {
    grid-template-columns: 1fr;
    max-width: 1120px;
  }
  body.client-view .ctrl-panel,
  body.client-view .staff-only {
    display: none !important;
  }
  @media (max-width: 960px) {
    .workspace {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .ctrl-panel {
      display: none;
    }
    .ctrl-panel.mob-open {
      display: flex;
    }
  }

  /* ── 左側控制面板 ── */
  .ctrl-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 15px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  @media (max-width: 960px) {
    .ctrl-panel { display: none; }
  }
  .sec-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-2);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sec-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface-muted);
    padding: 3px;
    border-radius: var(--radius-ctrl);
    border: 1px solid var(--line);
  }
  .mode-tab {
    border: none;
    background: transparent;
    padding: 7px 6px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink-2);
    border-radius: 6px;
    cursor: pointer;
  }
  .mode-tab.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--surface-soft);
    color: var(--ink-2);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip:active { transform: scale(0.98); }
  .chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #FFFFFF;
  }

  .input, .select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-ctrl);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    outline: none;
  }
  .input:focus, .select:focus { border-color: var(--accent); }
  .divider { height: 1px; background: var(--line); }

  .btn-random {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: var(--radius-ctrl);
    background: var(--accent);
    color: #FFFFFF;
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-random:active { transform: scale(0.98); }

  /* ── 右側預覽與風格快速切換列 ── */
  .preview-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  /* 手機與桌面共用的「DM 風格 & 實景排版」預覽選擇條 */
  .style-preview-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
  }
  .bar-group {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    max-width: 100%;
    scrollbar-width: none;
  }
  .bar-group::-webkit-scrollbar { display: none; }
  .bar-lbl {
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 2px;
  }
  .style-pill {
    border: 1px solid var(--line-strong);
    background: var(--surface-soft);
    color: var(--ink-2);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .style-pill.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .swatch-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.4);
  }

  .action-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
  }
  .stat-pill {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .stat-pill strong { color: var(--ink); font-weight: 800; }

  .action-btns {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .btn-act {
    height: 34px;
    padding: 0 12px;
    border-radius: var(--radius-ctrl);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    white-space: nowrap;
  }
  .btn-act:active { transform: scale(0.98); }
  .btn-act.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: #FFFFFF;
  }
  .btn-act.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  /* ── DM 海報主畫布（支援 4 種風格主題變數） ── */
  .dm-sheet {
    background: var(--dm-bg);
    border: 1px solid var(--dm-card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .dm-header {
    padding: 18px 22px 14px;
    background: var(--dm-header-bg);
    color: var(--dm-header-text);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--dm-accent);
  }
  .dm-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--dm-eyebrow);
    margin-bottom: 2px;
  }
  .dm-main-title {
    font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
    font-size: clamp(19px, 2.4vw, 25px);
    font-weight: 700;
    line-height: 1.25;
    color: var(--dm-header-text);
  }
  .dm-subtitle {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--dm-header-sub);
  }

  /* ── 多張實景圖（1~4張）自動拼貼畫廊 ── */
  .dm-scene-gallery {
    padding: 14px 18px 4px;
    background: var(--dm-bg);
  }
  @media (max-width: 560px) {
    .dm-scene-gallery { padding: 10px 10px 2px; }
  }
  .scene-collage {
    display: grid;
    gap: 8px;
    border-radius: 8px;
    overflow: hidden;
  }
  /* 1 張實景 */
  .scene-collage.count-1 {
    grid-template-columns: 1fr;
    height: 280px;
  }
  /* 2 張實景：左右雙併（手機版亦維持精緻雙圖或上下） */
  .scene-collage.count-2 {
    grid-template-columns: 1fr 1fr;
    height: 260px;
  }
  /* 3 張實景：左 1 大圖 + 右 2 小圖（雜誌 Bento 排版） */
  .scene-collage.count-3 {
    grid-template-columns: 1.35fr 1fr;
    grid-template-rows: 1fr 1fr;
    height: 310px;
  }
  .scene-collage.count-3 .sc-item:first-child {
    grid-row: 1 / span 2;
  }
  /* 4 張實景：2x2 四宮格空間應用 */
  .scene-collage.count-4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    height: 320px;
  }
  /* 義式畫報風時放大實景區高度 */
  .dm-sheet[data-style="editorial"] .scene-collage.count-1 { height: 350px; }
  .dm-sheet[data-style="editorial"] .scene-collage.count-2 { height: 320px; }
  .dm-sheet[data-style="editorial"] .scene-collage.count-3,
  .dm-sheet[data-style="editorial"] .scene-collage.count-4 { height: 380px; }

  @media (max-width: 560px) {
    .scene-collage.count-1 { height: 200px; }
    .scene-collage.count-2 { height: 175px; gap: 6px; }
    .scene-collage.count-3 { height: 220px; gap: 6px; }
    .scene-collage.count-4 { height: 230px; gap: 6px; }
  }

  .sc-item {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #262320;
    border-radius: 6px;
  }
  .sc-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .sc-item:hover img { transform: scale(1.03); }
  .sc-tag {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(20, 18, 16, 0.76);
    color: #fff;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 600;
    pointer-events: none;
  }

  /* ── 單片磁磚高密度網格 ── */
  .dm-body {
    padding: 14px 18px 18px;
    background: var(--dm-bg);
  }
  .dm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 10px;
  }
  @media (max-width: 560px) {
    .dm-body { padding: 10px; }
    .dm-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
  }

  /* 精簡版磁磚卡片 */
  .tile-card {
    background: var(--dm-card-bg);
    border: 1px solid var(--dm-card-border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .remove-item-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 5;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(28, 25, 23, 0.65);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .tile-card:hover .remove-item-btn { opacity: 1; }
  @media (hover: none) { .remove-item-btn { opacity: 0.85; } }

  .tile-stage {
    height: 136px;
    background: var(--dm-stage-bg);
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid var(--dm-card-border);
  }
  @media (max-width: 560px) {
    .tile-stage { height: 112px; padding: 8px; }
  }
  .tile-stage img.piece-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    border-radius: 2px;
    cursor: pointer;
  }
  .origin-flag {
    position: absolute;
    bottom: 5px;
    left: 7px;
    font-size: 14px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    pointer-events: none;
  }
  .scene-dot-btn {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: rgba(20, 18, 16, 0.78);
    color: #fff;
    border: none;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .tile-info {
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }
  .tile-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px;
  }
  .tile-code {
    font-size: 14px;
    font-weight: 800;
    color: var(--dm-ink);
  }
  .tile-size {
    font-size: 11px;
    font-weight: 700;
    color: var(--dm-accent);
  }
  .tile-series {
    font-size: 12px;
    font-weight: 700;
    color: var(--dm-ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile-stock-line {
    margin-top: 3px;
    padding-top: 5px;
    border-top: 1px dashed var(--dm-card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
  }
  .stock-val {
    font-weight: 800;
    color: var(--dm-stock);
  }
  .price-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--dm-accent);
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 6px 8px 8px;
    background: var(--dm-card-bg);
    border-top: 1px solid var(--dm-card-border);
  }
  .card-btn {
    height: 25px;
    border-radius: 4px;
    border: 1px solid var(--dm-card-border);
    background: transparent;
    color: var(--dm-ink-2);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .card-btn.accent {
    background: var(--dm-accent);
    border-color: var(--dm-accent);
    color: #fff;
  }

  /* DM 底部（有效時間 + QR） */
  .dm-footer {
    padding: 12px 18px;
    background: var(--dm-card-bg);
    border-top: 1px solid var(--dm-card-border);
    display: flex;

function getOriginFlag(origin) {
  const s = String(origin || "").trim();
  for (const [k, flag] of Object.entries(ORIGIN_FLAG_MAP)) {
    if (s.includes(k)) return flag;
  }
  return "";
}

function formatFloorPing(rawPing) {
  const n = Number(rawPing) || 0;
  if (n <= 0) return "0";
  if (n < 1) return n >= 0.5 ? "0.5" : String(Math.floor(n * 10) / 10);
  const flooredHalf = Math.floor(n * 2) / 2;
  return Number.isInteger(flooredHalf) ? String(flooredHalf) : flooredHalf.toFixed(1);
}

function parseSizeNums(sizeStr) {
  const s = String(sizeStr || "").replace(/[×*＊Ｘ]/g, "x");
  const m = s.match(/(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)/i);
  if (!m) return null;
  const a = parseFloat(m[1]), b = parseFloat(m[2]);
  if (isNaN(a) || isNaN(b)) return null;
  return [Math.min(a, b), Math.max(a, b)];
}

function isSizeMatchWithTolerance(itemSizeStr, targetSizeStr) {
  if (!targetSizeStr) return true;
  const targetNums = parseSizeNums(targetSizeStr);
  const itemNums = parseSizeNums(itemSizeStr);
  if (targetNums && itemNums) {
    return Math.abs(itemNums[0] - targetNums[0]) <= 1.2 && Math.abs(itemNums[1] - targetNums[1]) <= 1.2;
  }
  return String(itemSizeStr || "").toLowerCase().includes(String(targetSizeStr || "").toLowerCase().trim());
}

function formatNowTime() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function normalizeImgUrl(raw, forCanvas = false) {
  if (!raw) return "";
  let u = String(raw).split("#")[0].trim();
  if (!u) return "";
  const idMatch = u.match(/(?:\/d\/|[?&]id=)([a-zA-Z0-9_-]{15,})/);
  if (idMatch) u = `https://lh3.googleusercontent.com/d/${idMatch[1]}=w1000`;
  if (forCanvas && !u.includes("r2.dev")) {
    return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=1000&output=jpg`;
  }
  return u;
}

function extractProductMedia(p, stockSnap) {
  const scenes = [];
  const pieces = [];
  if (Array.isArray(p.images)) {
    p.images.forEach(item => {
      const s = String(item || "");
      const clean = normalizeImgUrl(s, false);
      if (!clean) return;
      if (s.includes("#scene")) scenes.push(clean);
      else if (s.includes("#pattern")) pieces.push(clean);
    });
  }
  const snapImg = stockSnap && stockSnap.imgUrl ? normalizeImgUrl(stockSnap.imgUrl, false) : "";
  const mainImg = snapImg || normalizeImgUrl(p.main_img_url, false) || pieces[0] || "";
  return { mainImg, scenes, pieces };
}

      `${SB_URL}/rest/v1/products?select=code,title_zh,brand,origin,size,color,style,area,price_num,price_per_pyeong,ratio,pieces_per_box,images,main_img_url,level,stock_status&is_active=eq.true&order=code.asc&limit=1000`,
      { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } }
    ).then(r => r.ok ? r.json() : []);

    const gasPromise = fetch(`${GAS_API}?action=getAllProductCodes`)
      .then(r => r.ok ? r.json() : { catalog: {} })
      .catch(() => ({ catalog: {} }));

    const [sbRows, gasData] = await Promise.all([sbPromise, gasPromise]);
    const stockCatalog = (gasData && gasData.catalog) || {};
    snapshotTimeStr = formatNowTime();

    allProducts = (sbRows || []).map(p => {
      const code = String(p.code || "").toUpperCase().trim();
      const snap = stockCatalog[code] || null;
      const ratio = Number(p.ratio) || (snap && Number(snap.ratio)) || 36;
      const availPcs = snap && snap.availPcs !== undefined
        ? Number(snap.availPcs)
        : (p.stock_status === "in_stock" ? Math.round(ratio * 15) : 0);
      const rawPing = ratio > 0 ? availPcs / ratio : 0;
      const media = extractProductMedia(p, snap);
      const sizeClean = String(p.size || (snap && snap.size) || "").replace(/\s*cm$/i, "").replace(/[×*＊Ｘ]/g, "x").trim();

      return {
        code,
        series: String(p.title_zh || (snap && snap.series) || code).trim(),
        origin: String(p.origin || "").trim(),
        flag: getOriginFlag(p.origin),
        size: sizeClean,
        color: String(p.color || (snap && snap.color) || "").trim(),
        style: String(p.style || "").trim(),
        area: String(p.area || "").trim(),
        level: p.level || "normal",
        pricePcs: Number(p.price_num) || 0,
        pricePing: Number(p.price_per_pyeong) || (Number(p.price_num) && ratio ? Math.round(Number(p.price_num) * ratio) : 0),
        ratio,
        availPcs,
        rawPing,
        pingStr: formatFloorPing(rawPing),
        mainImg: media.mainImg,
        scenes: media.scenes
      };
    }).filter(p => p.mainImg && p.availPcs > 0);

    renderSeriesOptions("");
    restoreFromUrl();
  } catch (err) {
    console.error(err);
    document.getElementById("dmBody").innerHTML = `<div class="state-box">載入資料時發生錯誤，請重新整理。</div>`;
  }
}

function renderSeriesOptions(kw) {
  const selSeries = document.getElementById("selSeries");
  const q = String(kw || "").trim().toUpperCase();
  const map = new Map();
  allProducts.forEach(p => {
    if (currentLevel !== "all" && p.level !== currentLevel) return;
    if (q && !p.series.toUpperCase().includes(q) && !p.code.includes(q)) return;
    const item = map.get(p.series) || { count: 0, size: p.size, sceneCount: 0, seenScenes: new Set() };
    item.count++;
    p.scenes.forEach(sc => {
      if (!item.seenScenes.has(sc)) {
        item.seenScenes.add(sc);
        item.sceneCount++;
      }
    });
    map.set(p.series, item);
  });

  // 優先把實景圖豐富（2~4張以上）且款式多的系列排在最前面
  const entries = Array.from(map.entries()).sort((a, b) => {
    const aRich = a[1].sceneCount >= 2 ? 2 : (a[1].sceneCount === 1 ? 1 : 0);
    const bRich = b[1].sceneCount >= 2 ? 2 : (b[1].sceneCount === 1 ? 1 : 0);
    if (aRich !== bRich) return bRich - aRich;
    return b[1].count - a[1].count;
  });

  selSeries.innerHTML = entries.map(([ser, info]) =>
    `<option value="${ser}">${ser}（${info.size ? info.size.replace(/x/gi, "×") + " · " : ""}${info.count}款${info.sceneCount ? " · 實景" + info.sceneCount + "張" : ""}）</option>`
  ).join("");
}

function pickBySeries() {
  const ser = document.getElementById("selSeries").value;
  const maxCnt = parseInt(document.getElementById("selCount").value, 10) || 12;
  filteredPool = allProducts.filter(p => p.series === ser && (currentLevel === "all" || p.level === currentLevel));
  document.getElementById("poolCountBadge").textContent = `共 ${filteredPool.length} 款`;
  currentPicked = filteredPool.slice(0, maxCnt);
  setupHeroScenes();
  renderDM();
}

function applyAndPick() {
  if (currentMode === "series") return pickBySeries();
  filteredPool = allProducts.filter(p => {
    if (currentLevel !== "all" && p.level !== currentLevel) return false;
    if (selectedSize && !isSizeMatchWithTolerance(p.size, selectedSize)) return false;
    if (selectedStyle) {
      const hay = `${p.area} ${p.style} ${p.series} ${p.size}`.toLowerCase();
      if (selectedStyle === "石紋") {
        if (!hay.includes("石紋") && !hay.includes("大理石") && !hay.includes("水泥")) return false;
      } else if (selectedStyle === "地鐵") {
        const nums = parseSizeNums(p.size);
        const isSmallStrip = nums && nums[0] <= 15 && nums[1] <= 50;
        if (!hay.includes("小品") && !hay.includes("筷子") && !hay.includes("鐵道") && !isSmallStrip) return false;
      } else if (!hay.includes(selectedStyle)) {
        return false;
      }
    }
    return true;
  });

  document.getElementById("poolCountBadge").textContent = `符合 ${filteredPool.length} 款`;
  const maxCnt = parseInt(document.getElementById("selCount").value, 10) || 12;
  const shuffled = [...filteredPool].sort(() => Math.random() - 0.5);
  shuffled.sort((a, b) => b.scenes.length - a.scenes.length);
  currentPicked = shuffled.slice(0, maxCnt);
  setupHeroScenes();
  renderDM();
}

function randomizePick() {
  if (currentMode === "series") {
    const sel = document.getElementById("selSeries");
    if (sel.options.length > 0) {
      // 優先抽有實景圖的系列
      const richIndices = [];
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].text.includes("實景")) richIndices.push(i);
      }
      const pool = richIndices.length > 0 ? richIndices : Array.from({ length: sel.options.length }, (_, i) => i);
      sel.selectedIndex = pool[Math.floor(Math.random() * pool.length)];
      pickBySeries();
    }
    return;
  }
  applyAndPick();
}

function removePickedCard(code) {
  currentPicked = currentPicked.filter(p => p.code !== code);
  setupHeroScenes();
  renderDM();
}

// 收集並去重實景圖（支援 2~4 張多圖展示）
function setupHeroScenes() {
  const seen = new Set();
  heroScenes = [];
  currentPicked.forEach(p => {
    p.scenes.forEach(sc => {
      if (!seen.has(sc)) {
        seen.add(sc);
        heroScenes.push({ url: sc, code: p.code, series: p.series });
      }
    });
  });
}

function getActiveScenesForDisplay() {
  if (currentSceneLayout === "0" || heroScenes.length === 0) return [];
  if (currentSceneLayout === "auto") {
    return heroScenes.slice(0, Math.min(4, heroScenes.length));
  }
  const targetN = parseInt(currentSceneLayout, 10) || 1;
  // 若該系列實景圖不足指定張數，循環或取現有張數補齊以展示多圖排版效果
  const list = [];
  for (let i = 0; i < Math.min(targetN, Math.max(heroScenes.length, targetN)); i++) {
    list.push(heroScenes[i % heroScenes.length]);
  }
  return list;
}

function buildDynamicTitle(pickedList = currentPicked, mode = currentMode) {
  if (mode === "series") {
    const first = pickedList[0];
    const ser = (first && first.series) || document.getElementById("selSeries").value || "精選系列";
    const sz = first && first.size ? first.size.replace(/x/gi, "×") + " cm" : "";
    return {
      title: `${ser}系列`,
      sub: `${sz ? "規格 " + sz + " · " : ""}現貨共 ${pickedList.length} 款`
    };
  }
  const parts = [];
  if (selectedSize) parts.push(selectedSize.replace(/x/gi, "×") + " cm");
  if (selectedStyle) parts.push(selectedStyle === "石紋" ? "石紋 / 理石磚" : selectedStyle === "地鐵" ? "地鐵磚 / 條磚" : selectedStyle + "磚");
  const headStr = parts.length > 0 ? parts.join(" · ") : "精選磁磚";
  return {
    title: headStr,
    sub: `現貨共 ${pickedList.length} 款`
  };
}

function restoreFromUrl() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("price") === "1") document.getElementById("chkShowPrice").checked = true;
  if (params.get("style") && STYLE_PALETTES[params.get("style")]) setDmStyle(params.get("style"));
  if (params.get("sc")) setSceneLayout(params.get("sc"));
  if (params.get("view") === "client") document.body.classList.add("client-view");

  const codesParam = params.get("codes");
  if (codesParam) {
    const codeList = codesParam.split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
    const matched = codeList.map(c => allProducts.find(p => p.code === c)).filter(Boolean);
    if (matched.length > 0) {
      currentPicked = matched;
      setupHeroScenes();
      renderDM();
      return;
    }
  }
  pickBySeries();
}

function loadImageForCanvas(url) {
  return new Promise(resolve => {
    if (!url) return resolve(null);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => {
      if (!url.includes("wsrv.nl")) {
        const proxy = `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=1000&output=jpg`;
        const img2 = new Image();
        img2.crossOrigin = "anonymous";
        img2.onload = () => resolve(img2);
        img2.onerror = () => resolve(null);
        img2.src = proxy;
      } else {
        resolve(null);
      }
    };
    img.src = normalizeImgUrl(url, true);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCoverImage(ctx, img, x, y, w, h, radius = 8) {
  if (!img) return;
  ctx.save();
  roundRect(ctx, x, y, w, h, radius);
  ctx.clip();
  const sRatio = Math.max(w / img.width, h / img.height);
  const sw = img.width * sRatio, sh = img.height * sRatio;
  ctx.drawImage(img, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
  ctx.restore();
}

// ── 將指定頁面配置渲染成高畫質 Canvas（供單頁 JPG 與多頁 PDF 共用） ──
async function renderPageToCanvas(pageState) {
  const { items, scenes, title, sub, dmStyle, showPrice, shareUrl } = pageState;
  const pal = STYLE_PALETTES[dmStyle] || STYLE_PALETTES.warm;
  const cols = items.length >= 9 ? 4 : 3;
  const rows = Math.ceil(items.length / cols);
  const scCount = Math.min(4, scenes.length);

  const W = 1200;
  const pad = 34;
  const gap = 16;
  const headerH = 135;
  const heroH = scCount === 0 ? 0 : (dmStyle === "editorial" ? 410 : (scCount >= 3 ? 350 : 290));
  const cardH = 305;
  const footerH = 108;
  const bodyH = rows * cardH + Math.max(0, rows - 1) * gap + pad * 2;
  const H = headerH + (heroH ? heroH + 18 : 0) + bodyH + footerH;

  const cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext("2d");

  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  // Header
  ctx.fillStyle = pal.headerBg;
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = pal.accent;
  ctx.fillRect(0, headerH - 4, W, 4);

  ctx.fillStyle = pal.eyebrow;
  ctx.font = "700 14px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText("ELITILE IMPORTED PORCELAIN TILES", pad, 42);

  ctx.fillStyle = pal.headerText;
  ctx.font = "800 34px 'Noto Sans TC', sans-serif";
  ctx.fillText(title, pad, 88);

  ctx.fillStyle = pal.headerSub;
  ctx.font = "600 19px 'Noto Sans TC', sans-serif";
  ctx.fillText(sub, pad, 118);

  let curY = headerH;

  // 1~4 張實景圖拼貼繪製
  if (scCount > 0) {
    curY += 18;
    const scImgs = await Promise.all(scenes.slice(0, 4).map(s => loadImageForCanvas(s.url)));
    const innerW = W - pad * 2;
    const g = 10;

    if (scCount === 1) {
      drawCoverImage(ctx, scImgs[0], pad, curY, innerW, heroH, 10);
    } else if (scCount === 2) {
      const w2 = (innerW - g) / 2;
      drawCoverImage(ctx, scImgs[0], pad, curY, w2, heroH, 10);
      drawCoverImage(ctx, scImgs[1], pad + w2 + g, curY, w2, heroH, 10);
    } else if (scCount === 3) {
      const wLeft = Math.round(innerW * 0.57);
      const wRight = innerW - wLeft - g;
      const hHalf = (heroH - g) / 2;
      drawCoverImage(ctx, scImgs[0], pad, curY, wLeft, heroH, 10);
      drawCoverImage(ctx, scImgs[1], pad + wLeft + g, curY, wRight, hHalf, 10);
      drawCoverImage(ctx, scImgs[2], pad + wLeft + g, curY + hHalf + g, wRight, hHalf, 10);
    } else {
      const w2 = (innerW - g) / 2;
      const h2 = (heroH - g) / 2;
      drawCoverImage(ctx, scImgs[0], pad, curY, w2, h2, 10);
      drawCoverImage(ctx, scImgs[1], pad + w2 + g, curY, w2, h2, 10);
      drawCoverImage(ctx, scImgs[2], pad, curY + h2 + g, w2, h2, 10);
      drawCoverImage(ctx, scImgs[3], pad + w2 + g, curY + h2 + g, w2, h2, 10);
    }
    curY += heroH;
  }

  // 繪製單片卡片網格
  const pieceImgs = await Promise.all(items.map(p => loadImageForCanvas(p.mainImg)));
  const cardW = (W - pad * 2 - gap * (cols - 1)) / cols;

  items.forEach((p, idx) => {
    const r = Math.floor(idx / cols);
    const c = idx % cols;
    const x = pad + c * (cardW + gap);
    const y = curY + pad + r * (cardH + gap);

    ctx.fillStyle = pal.cardBg;
    roundRect(ctx, x, y, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = pal.cardBorder;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const stH = 168;
    ctx.fillStyle = pal.stageBg;
    roundRect(ctx, x + 1.5, y + 1.5, cardW - 3, stH, 9);
    ctx.fill();

    const pImg = pieceImgs[idx];
    if (pImg) {
      const maxW = cardW - 26;
      const maxH = stH - 22;
      const ratio = Math.min(maxW / pImg.width, maxH / pImg.height);
      const dw = pImg.width * ratio, dh = pImg.height * ratio;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.18)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.drawImage(pImg, x + (cardW - dw) / 2, y + (stH - dh) / 2, dw, dh);
      ctx.restore();
    }

    if (p.flag) {
      ctx.font = "20px sans-serif";
      ctx.fillText(p.flag, x + 9, y + stH - 9);
    }

    ctx.fillStyle = pal.ink;
    ctx.font = "800 21px 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif";
    ctx.fillText(p.code, x + 13, y + stH + 32);

    const szStr = (p.size || "").replace(/x/gi, "×");
    ctx.font = "700 15px 'Plus Jakarta Sans', sans-serif";
    ctx.fillStyle = pal.accent;
    ctx.fillText(szStr, x + cardW - ctx.measureText(szStr).width - 13, y + stH + 31);

    ctx.fillStyle = pal.ink2;
    ctx.font = "700 17px 'Noto Sans TC', sans-serif";
    ctx.fillText(p.series, x + 13, y + stH + 60);

    ctx.fillStyle = pal.stock;
    ctx.font = "800 17px 'Noto Sans TC', sans-serif";
    ctx.fillText(`可用 ${p.availPcs.toLocaleString()}片 / ${p.pingStr}坪`, x + 13, y + stH + 92);

    if (showPrice && (p.pricePcs > 0 || p.pricePing > 0)) {
      ctx.fillStyle = pal.accent;
      ctx.font = "800 16px 'Noto Sans TC', sans-serif";
      ctx.fillText(`${p.pricePcs > 0 ? "$" + p.pricePcs.toLocaleString() + "/片" : ""} ${p.pricePing > 0 ? "$" + p.pricePing.toLocaleString() + "/坪" : ""}`.trim(), x + 13, y + stH + 119);
    }
  });

  // Footer
  const footY = H - footerH;
  ctx.fillStyle = pal.cardBg;
  ctx.fillRect(0, footY, W, footerH);
  ctx.fillStyle = pal.cardBorder;
  ctx.fillRect(0, footY, W, 1.5);

  ctx.fillStyle = pal.ink;
  ctx.font = "800 20px 'Noto Sans TC', sans-serif";
  ctx.fillText(`庫存有效時間：${snapshotTimeStr || formatNowTime()}`, pad, footY + 44);

  ctx.fillStyle = pal.muted;
  ctx.font = "600 16px 'Noto Sans TC', sans-serif";
  ctx.fillText("現場庫存即時變動，掃描右側 QR Code 可開啟線上互動頁面查看實景大圖或直接下保留單", pad, footY + 74);

  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=3&data=${encodeURIComponent(shareUrl)}`;
  const qrImg = await loadImageForCanvas(qrUrl);
  if (qrImg) {
    ctx.fillStyle = "#FFFFFF";
    roundRect(ctx, W - pad - 84, footY + 12, 84, 84, 6);
    ctx.fill();
    ctx.drawImage(qrImg, W - pad - 80, footY + 16, 76, 76);
  }

  return cv;
}

function getCurrentPageStateSnapshot() {
  const { title, sub } = buildDynamicTitle();
  return {
    items: [...currentPicked],
    scenes: getActiveScenesForDisplay(),
    title,
    sub,
    dmStyle: currentDmStyle,
    showPrice: document.getElementById("chkShowPrice").checked,
    shareUrl: getShareUrl()
  };
}

async function exportFullPosterJPG() {
  if (currentPicked.length === 0) return;
  if (currentPicked.length === 1) return exportSingleTileJPG(currentPicked[0].code);
  showToast("正在合成高清 DM 海報 JPG...");
  const state = getCurrentPageStateSnapshot();
  const cv = await renderPageToCanvas(state);
  openImageZoom(cv.toDataURL("image/jpeg", 0.92), `${state.title}_DM`);
}

// ── 多頁 PDF 電子目錄組裝與快速生成 ──
function addCurrentPageToPdfQueue() {
  if (currentPicked.length === 0) return showToast("目前畫面沒有產品可加入");
  const snap = getCurrentPageStateSnapshot();
  pdfPagesQueue.push(snap);
  renderPdfQueueBar();
  showToast(`已將「${snap.title}」加入 PDF 第 ${pdfPagesQueue.length} 頁！可繼續挑其他系列加入。`);
}

function removePdfQueuePage(idx) {
  pdfPagesQueue.splice(idx, 1);
  renderPdfQueueBar();
}

function renderPdfQueueBar() {
  const badge = document.getElementById("pdfCountBadge");
  const info = document.getElementById("pdfQueueInfo");
  badge.textContent = `PDF 目錄籃：${pdfPagesQueue.length} 頁`;
  if (pdfPagesQueue.length === 0) {
    info.innerHTML = `
      <span class="pdf-badge" id="pdfCountBadge">PDF 目錄籃：0 頁</span>
      <span style="font-size:12px;color:#D6D3CD;">可點「➕ 加入此頁至 PDF」組合多個系列，或直接點右側生成當頁 PDF</span>
    `;
    return;
  }
  const chips = pdfPagesQueue.map((p, i) => `
    <span class="pdf-page-chip">
      <span>P${i + 1}. ${p.title} (${p.items.length}款)</span>
      <button type="button" onclick="removePdfQueuePage(${i})" title="移除此頁">✕</button>
    </span>
  `).join("");
  info.innerHTML = `<span class="pdf-badge" id="pdfCountBadge">PDF 目錄籃：${pdfPagesQueue.length} 頁</span>` + chips;
}

async function generateMultiPagePDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    return showToast("PDF 引擎載入中，請稍候 1 秒再按一次");
  }
  const pagesToRender = pdfPagesQueue.length > 0 ? pdfPagesQueue : [getCurrentPageStateSnapshot()];
  showToast(`正在快速生成 ${pagesToRender.length} 頁 PDF 電子目錄，請稍候...`);

  const { jsPDF } = window.jspdf;
  let pdf = null;

  for (let i = 0; i < pagesToRender.length; i++) {
    const cv = await renderPageToCanvas(pagesToRender[i]);
    const imgData = cv.toDataURL("image/jpeg", 0.9);
    const wMm = 210; // 標準 A4 寬度 210mm，高度依內容等比延伸不裁切
    const hMm = Math.round((cv.height / cv.width) * wMm);

    if (i === 0) {
      pdf = new jsPDF({
        orientation: hMm >= wMm ? "p" : "l",
        unit: "mm",
        format: [wMm, hMm]
      });
    } else {
      pdf.addPage([wMm, hMm], hMm >= wMm ? "p" : "l");
    }
    pdf.addImage(imgData, "JPEG", 0, 0, wMm, hMm, undefined, "FAST");
  }

  const fileName = pagesToRender.length > 1
    ? `高雅瓷_精選電子目錄_${pagesToRender.length}頁.pdf`
    : `高雅瓷_${pagesToRender[0].title}_DM.pdf`;
  pdf.save(fileName);
  showToast(`已完成下載：${fileName}`);
}

// ── 匯出單片專屬規格卡 JPG (1080 x 1350) ──
async function exportSingleTileJPG(code) {
  const p = allProducts.find(x => x.code === code);
  if (!p) return;
  showToast(`正在產生 ${p.code} 單片規格卡 JPG...`);

  const pal = STYLE_PALETTES[currentDmStyle] || STYLE_PALETTES.warm;
  const W = 1080, H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext("2d");

  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = pal.headerBg;
  ctx.fillRect(0, 0, W, 145);
  ctx.fillStyle = pal.accent;
  ctx.fillRect(0, 145, W, 5);

  ctx.fillStyle = pal.eyebrow;
  ctx.font = "700 17px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText("ELITILE IMPORTED PORCELAIN TILES", 44, 52);

  ctx.fillStyle = pal.headerText;
  ctx.font = "800 42px 'Noto Sans TC', sans-serif";
  ctx.fillText(`${p.flag ? p.flag + " " : ""}${p.series}  ${p.code}`, 44, 110);

  const szTxt = `${(p.size || "").replace(/x/gi, "×")} cm`;
  ctx.font = "800 26px 'Plus Jakarta Sans', sans-serif";
  const szW = ctx.measureText(szTxt).width + 40;
  ctx.fillStyle = pal.accent;
  roundRect(ctx, W - 44 - szW, 68, szW, 50, 8);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(szTxt, W - 44 - szW + 20, 102);

  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=3&data=${encodeURIComponent("https://bigt.cc/web/product.html?code=" + p.code)}`;
  const [pieceImg, sceneImg, qrImg] = await Promise.all([
    loadImageForCanvas(p.mainImg),
    p.scenes[0] ? loadImageForCanvas(p.scenes[0]) : Promise.resolve(null),
    loadImageForCanvas(qrUrl)
  ]);

  let curY = 180;
  if (sceneImg) {
    drawCoverImage(ctx, sceneImg, 44, curY, W - 88, 430, 14);
    curY += 452;
  }

  const stageH = sceneImg ? 350 : 720;
  ctx.fillStyle = pal.cardBg;
  roundRect(ctx, 44, curY, W - 88, stageH, 14);
  ctx.fill();
  ctx.strokeStyle = pal.cardBorder;
  ctx.lineWidth = 2;
  ctx.stroke();

  if (pieceImg) {
    const pad = 38;
    const ratio = Math.min((W - 88 - pad * 2) / pieceImg.width, (stageH - pad * 2) / pieceImg.height);
    const dw = pieceImg.width * ratio, dh = pieceImg.height * ratio;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.2)";
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 6;
    ctx.drawImage(pieceImg, 44 + (W - 88 - dw) / 2, curY + (stageH - dh) / 2, dw, dh);
    ctx.restore();
  }
  curY += stageH + 22;

  const infoH = H - curY - 38;
  ctx.fillStyle = pal.cardBg;
  roundRect(ctx, 44, curY, W - 88, infoH, 14);
  ctx.fill();
  ctx.strokeStyle = pal.cardBorder;
  ctx.stroke();

  ctx.fillStyle = pal.ink;
  ctx.font = "800 34px 'Noto Sans TC', sans-serif";
  ctx.fillText(`${p.code} · ${p.series}（${(p.size || "").replace(/x/gi, "×")} cm）`, 76, curY + 68);

  ctx.fillStyle = pal.stock;
  ctx.font = "800 30px 'Noto Sans TC', sans-serif";
  ctx.fillText(`可用庫存：${p.availPcs.toLocaleString()}片 / ${p.pingStr}坪`, 76, curY + 128);

  const showPrice = document.getElementById("chkShowPrice").checked;
  if (showPrice && (p.pricePcs > 0 || p.pricePing > 0)) {
    ctx.fillStyle = pal.accent;
    ctx.font = "800 30px 'Noto Sans TC', sans-serif";
    ctx.fillText(
      `單價：${p.pricePcs > 0 ? "$" + p.pricePcs.toLocaleString() + "/片" : ""} ${p.pricePing > 0 ? "($" + p.pricePing.toLocaleString() + "/坪)" : ""}`,
      76,
      curY + 182
    );
  }

  ctx.fillStyle = pal.muted;
  ctx.font = "600 20px 'Noto Sans TC', sans-serif";
  ctx.fillText(`庫存有效時間：${snapshotTimeStr || formatNowTime()}`, 76, curY + infoH - 28);

  if (qrImg) {
    const qSize = 148;
    ctx.fillStyle = "#FFFFFF";
    roundRect(ctx, W - 44 - qSize - 32, curY + (infoH - qSize) / 2 - 4, qSize + 8, qSize + 8, 8);
    ctx.fill();
    ctx.drawImage(qrImg, W - 44 - qSize - 28, curY + (infoH - qSize) / 2, qSize, qSize);
  }

  openImageZoom(cv.toDataURL("image/jpeg", 0.92), `${p.code}_${p.series}_單片DM`);
}
